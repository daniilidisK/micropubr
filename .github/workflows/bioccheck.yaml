# Runs BiocCheck to report Bioconductor submission readiness.
# Informative only: `continue-on-error: true` means BiocCheck ERRORs show up as
# a failed step (and a warning annotation) without failing the workflow.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: bioccheck.yaml

permissions: read-all

jobs:
  bioccheck:
    runs-on: ubuntu-latest

    name: BiocCheck (ubuntu-latest, release)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # SpiecEasi / qiime2R are GitHub-only Suggests; see R-CMD-check.yaml.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::BiocManager
            any::rcmdcheck
            SpiecEasi=?ignore
            qiime2R=?ignore
          needs: check

      - name: Install BiocCheck
        run: |
          BiocManager::install("BiocCheck", ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - name: Run BiocCheck
        continue-on-error: true
        run: |
          BiocCheck::BiocCheck(
            ".",
            `new-package` = TRUE,
            `quit-with-status` = TRUE
          )
        shell: Rscript {0}

      - name: Upload BiocCheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bioccheck-report
          path: '**/*.BiocCheck'
          if-no-files-found: ignore
