# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Bioconductor dependencies (phyloseq, DESeq2, ANCOMBC, ...) are resolved
# automatically by pak from the biocViews field in DESCRIPTION.
#
# SpiecEasi and qiime2R are optional (Suggests) and only available on GitHub,
# so pak cannot resolve them from CRAN/Bioconductor; `pkg=?ignore` skips them
# (the code paths that need them are guarded by .mp_require()). To exercise
# them in CI instead, replace the two `=?ignore` refs with
# `github::zdk123/SpiecEasi, github::jbisanz/qiime2R`.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          # No R-devel job: there are no binaries of the Bioconductor stack for
          # R-devel, so installing it from source takes well over an hour.
          # Bioconductor 3.22 ships ANCOMBC 2.12.0, which imports CVXR::solve
          # (removed in CVXR 1.9) and so cannot be installed; the ANCOM-BC2
          # tests skip themselves when the package is absent.
          - {os: ubuntu-latest,  r: 'oldrel-1', extra: 'ANCOMBC=?ignore'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Many Suggests are heavy and/or optional; do not fail if one is missing.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            SpiecEasi=?ignore
            qiime2R=?ignore
            ${{ matrix.config.extra }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
